version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app_backend
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red-cba
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app_backend:
    image: lejackouioui/adso-flask-app:latest
    container_name: flask_app
    restart: always
    ports:
      - "80:5050"
    networks:
      - red-cba
    environment:
      FLASK_ENV: development
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_HOST: servidor-bd
      MYSQL_USER: ${MYSQL_USER}
    depends_on:
      servidor-bd:
        condition: service_healthy

    uptime-kuma:
      image: louislam/uptime-kuma:1
      container_name: uptime-kuma
      restart: always
      ports:
        - "3001:3001"
      volumes:
        - uptime-kuma-data:/app/data
      networks:
        - red-cba

networks:
  red-cba:

volumes:
  mysql_data:
  uptime-kuma-data:
